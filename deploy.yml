name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: نصب وابستگی‌ها
        run: npm ci

      - name: ساخت نسخه نهایی
        run: npm run build

      - name: تنظیم GitHub Pages
        uses: actions/configure-pages@v5

      - name: آپلود فایل‌های ساخته‌شده
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: انتشار در GitHub Pages
        uses: actions/deploy-pages@v4